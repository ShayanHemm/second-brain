<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html { color-scheme: dark; } img { max-width: 100%; }
/* ───────────────────────── tokens: dark-first (the night sky), full light theme ───────────────────────── */
:root {
  color-scheme: dark;
  --ground: #0F0E17; --surface: #16152A; --raised: #1E1D36; --sunk: #0B0A12;
  --line: rgba(236,232,246,0.08); --line-strong: rgba(236,232,246,0.18);
  --ink: #ECE8F6; --ink-2: #BDB8D0; --muted: #8A85A3; --paper-ink: #F3ECD8;
  --accent: #F2B134; --accent-ink: #1A1300; --accent-soft: rgba(242,177,52,0.14); --glow: rgba(242,177,52,0.45);
  --good: #7FD1A3; --bad: #F06B7E; --info: #8AB4F8;
  --k-theme: #8AB4F8; --k-person: #F2B8A0; --k-project: #7FD1C8; --k-goal: #F2B134;
  --t-journal: #E7D7B1; --t-idea: #9ED9FF; --t-task: #A7E39C; --t-goal: #F2B134; --t-question: #C9A6F5; --t-feeling: #F7A1C4; --t-decision: #FFD9A0; --t-note: #B9B5C9;
  --m-2: #5B7CDB; --m-1: #7E95D9; --m0: #8C8A9A; --m1: #D9A857; --m2: #F2B134; --m-none: rgba(236,232,246,0.06);
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 14px; --radius-s: 8px;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --rail-w: 76px; --side-w: 350px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #F5F4FA; --surface: #FFFFFF; --raised: #EEEDF6; --sunk: #E9E8F1;
    --line: rgba(27,26,46,0.08); --line-strong: rgba(27,26,46,0.18);
    --ink: #1B1A2E; --ink-2: #44415C; --muted: #6E6B85; --paper-ink: #2A2415;
    --accent: #B8780A; --accent-ink: #FFFFFF; --accent-soft: rgba(184,120,10,0.12); --glow: rgba(184,120,10,0.30);
    --good: #1F8A5B; --bad: #C8384F; --info: #2F6FD6;
    --k-theme: #2F6FD6; --k-person: #C96B4B; --k-project: #1F9E92; --k-goal: #B8780A;
    --t-journal: #8A6D2A; --t-idea: #1F7FB5; --t-task: #2F8F3E; --t-goal: #B8780A; --t-question: #7A4BC2; --t-feeling: #C2457A; --t-decision: #B35A12; --t-note: #5E5A74;
    --m-2: #3D5FCF; --m-1: #6A82D0; --m0: #8C8A9A; --m1: #C98F2C; --m2: #B8780A; --m-none: rgba(27,26,46,0.06);
    --shadow: 0 10px 30px rgba(27,26,46,0.10);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #F5F4FA; --surface: #FFFFFF; --raised: #EEEDF6; --sunk: #E9E8F1;
  --line: rgba(27,26,46,0.08); --line-strong: rgba(27,26,46,0.18);
  --ink: #1B1A2E; --ink-2: #44415C; --muted: #6E6B85; --paper-ink: #2A2415;
  --accent: #B8780A; --accent-ink: #FFFFFF; --accent-soft: rgba(184,120,10,0.12); --glow: rgba(184,120,10,0.30);
  --good: #1F8A5B; --bad: #C8384F; --info: #2F6FD6;
  --k-theme: #2F6FD6; --k-person: #C96B4B; --k-project: #1F9E92; --k-goal: #B8780A;
  --t-journal: #8A6D2A; --t-idea: #1F7FB5; --t-task: #2F8F3E; --t-goal: #B8780A; --t-question: #7A4BC2; --t-feeling: #C2457A; --t-decision: #B35A12; --t-note: #5E5A74;
  --m-2: #3D5FCF; --m-1: #6A82D0; --m0: #8C8A9A; --m1: #C98F2C; --m2: #B8780A; --m-none: rgba(27,26,46,0.06);
  --shadow: 0 10px 30px rgba(27,26,46,0.10);
}

/* ───────────────────────── base ───────────────────────── */
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--info); }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ───────────────────────── shell ───────────────────────── */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w); height: 100%; min-height: 100%; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 14px 12px; border-right: 1px solid var(--line); background: var(--sunk); }
.rail .logo { width: 40px; height: 40px; margin-bottom: 10px; display: grid; place-items: center; }
.rail .logo svg { width: 36px; height: 36px; }
.rail nav { display: flex; flex-direction: column; gap: 4px; width: 100%; padding-inline: 8px; }
.rail .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 9px 4px; border: 0; background: transparent; color: var(--muted); border-radius: 10px; font-size: 10.5px; letter-spacing: 0.04em; }
.rail .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.rail .tab:hover { color: var(--ink); background: var(--raised); }
.rail .tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.rail .spacer { flex: 1; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 22px 8px; }
.topbar .date { font-family: var(--font-serif); font-size: 26px; line-height: 1.1; font-weight: 400; }
.topbar .date em { color: var(--muted); font-style: italic; }
.topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.on .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
.pill.off .dot { background: var(--bad); }
.pill.warn .dot { background: var(--accent); }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 22px 60px; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .scroll { scroll-behavior: auto; } }

/* ───────────────────────── capture dock ───────────────────────── */
.capture { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin: 10px 0 18px; position: relative; overflow: hidden; }
.capture::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.7; }
.capture textarea { width: 100%; border: 0; background: transparent; resize: none; padding: 16px 18px 6px; font-family: var(--font-serif); font-size: 19px; line-height: 1.45; color: var(--paper-ink); min-height: 64px; max-height: 50vh; outline: none; }
.capture textarea::placeholder { color: var(--muted); font-style: italic; }
.capture .row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 12px; flex-wrap: wrap; }
.capture .row .grow { flex: 1; }
.chip { border: 1px solid var(--line-strong); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.chip:hover { border-color: var(--ink-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.dial { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.dial button { border: 0; background: transparent; padding: 4px 9px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); }
.dial button:last-child { border-right: 0; }
.dial button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; line-height: 1.2; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 0 0 var(--glow); }
.btn.primary:hover { box-shadow: 0 0 18px var(--glow); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--raised); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.capture .status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 18px; }
.capture .status.busy::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.capture .attach { display: flex; gap: 8px; padding: 0 12px 10px; flex-wrap: wrap; }
.capture .attach img { height: 56px; border-radius: 8px; border: 1px solid var(--line); }
.banner { border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--radius-s); padding: 10px 14px; font-size: 13px; color: var(--ink-2); margin: 10px 0; display: flex; gap: 10px; align-items: center; }
.banner.warn { border-color: var(--accent); }

/* ───────────────────────── views ───────────────────────── */
.view { display: none; }
.view.active { display: block; }
.view-head { display: flex; align-items: baseline; gap: 14px; margin: 6px 0 14px; flex-wrap: wrap; }
.view-head h2 { font-family: var(--font-serif); font-size: 28px; font-weight: 400; }
.view-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 12px; min-width: 200px; color: var(--ink); }
.search:focus { border-color: var(--accent); outline: none; }

/* journal */
.ribbon { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; align-items: center; }
.ribbon .grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.ribbon .cell { width: 11px; height: 11px; border-radius: 3px; background: var(--m-none); border: 0; padding: 0; cursor: pointer; }
.ribbon .cell[data-m="-2"] { background: var(--m-2); } .ribbon .cell[data-m="-1"] { background: var(--m-1); } .ribbon .cell[data-m="0"] { background: var(--m0); } .ribbon .cell[data-m="1"] { background: var(--m1); } .ribbon .cell[data-m="2"] { background: var(--m2); }
.ribbon .cell[data-has="1"][data-m="none"] { background: var(--line-strong); }
.ribbon .cell.today { outline: 1px solid var(--accent); outline-offset: 1px; }
.ribbon .legend { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); grid-column: 1 / -1; flex-wrap: wrap; }
.ribbon .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ribbon .stats { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
.ribbon .stats b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.day { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 12px; position: sticky; top: 0; background: linear-gradient(var(--ground) 80%, transparent); padding: 6px 0; z-index: 2; }
.day h3 { font-family: var(--font-serif); font-size: 20px; font-weight: 400; }
.day .meta { color: var(--muted); font-size: 12.5px; }
.day .mood { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; position: relative; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--line-strong); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.example { border-style: dashed; }
.card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.type { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.type i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.card .time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card .title { font-family: var(--font-serif); font-size: 20px; font-weight: 500; color: var(--ink); margin: 2px 0 4px; }
.card .text { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.55; color: var(--paper-ink); white-space: pre-wrap; max-width: 68ch; }
.card .text.clamp { max-height: 9.4em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.card .more { background: none; border: 0; color: var(--info); padding: 2px 0; font-size: 12.5px; }
.card .summary { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 12px; border-radius: 6px; padding: 2px 8px; border: 1px solid var(--line-strong); color: var(--ink-2); background: transparent; display: inline-flex; gap: 5px; align-items: center; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.tag:hover { border-color: var(--c); color: var(--ink); }
.gauges { display: flex; gap: 14px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.gauge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.gauge .segs { display: inline-flex; gap: 2px; }
.gauge .segs i { width: 9px; height: 9px; border-radius: 2px; background: var(--m-none); }
.gauge .segs i.on { background: var(--c); }
.gauge .segs i.ai { background: transparent; border: 1px solid var(--c); }
.list { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.list li { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
.list li label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.list li input[type="checkbox"] { accent-color: var(--accent); margin-top: 3px; }
.list li.done span { text-decoration: line-through; color: var(--muted); }
.q { color: var(--t-question); }
.proposals { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.proposal { display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--raised); border-radius: 8px; padding: 6px 10px; flex-wrap: wrap; }
.proposal .why { color: var(--muted); }
.proposal .to { color: var(--ink); font-weight: 600; }
.followup { margin-top: 10px; font-family: var(--font-serif); font-style: italic; color: var(--ink-2); font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card .actions { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.card .actions .btn.ghost { font-size: 12.5px; padding: 4px 8px; }
.badge { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; }
.badge.soft { color: var(--muted); border-color: var(--line-strong); }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-family: var(--font-serif); font-size: 18px; font-style: italic; }
.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px; }
.welcome h3 { font-family: var(--font-serif); font-size: 24px; font-weight: 400; margin-bottom: 8px; }
.welcome p { color: var(--ink-2); max-width: 64ch; margin: 6px 0; }
.welcome .prompts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* network */
.net-wrap { position: relative; height: calc(100vh - 230px); min-height: 460px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: radial-gradient(ellipse at 30% 20%, rgba(138,180,248,0.07), transparent 55%), radial-gradient(ellipse at 75% 75%, rgba(242,177,52,0.06), transparent 50%), var(--sunk); }
.net-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.net-wrap canvas.grabbing { cursor: grabbing; }
.net-tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.net-tools .chip { background: var(--surface); }
.net-legend { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }
.net-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.net-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 260px; display: none; z-index: 3; }
.net-tip b { display: block; font-family: var(--font-serif); font-size: 14.5px; font-weight: 500; }
.net-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-serif); font-style: italic; font-size: 18px; pointer-events: none; }

/* patterns */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px 14px; }
.tile .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { font-family: var(--font-serif); font-size: 19px; font-weight: 500; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.panel svg { width: 100%; height: auto; display: block; overflow: visible; }
.statement { font-family: var(--font-serif); font-size: 16px; line-height: 1.5; color: var(--paper-ink); padding: 8px 0; border-top: 1px solid var(--line); }
.statement:first-of-type { border-top: 0; }
.statement .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.conf { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.trend { display: grid; grid-template-columns: minmax(90px, 1fr) 70px 1fr; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.trend .bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.trend .bar i { display: block; height: 100%; background: var(--k-theme); }
.trend .d { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.trend .up { color: var(--good); } .trend .down { color: var(--bad); }
.loops li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.loops li:first-child { border-top: 0; }
.loops .age { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }

/* ─── think it through: one Socratic question at a time ─── */
function threadTurns(t) {
  const turns = [];
  for (const s of t.steps) { if (s.role === 'claude') turns.push({ role: 'assistant', content: s.text }); else turns.push({ role: 'user', content: (s.role === 'note' ? '(note to self) ' : '') + s.text }); }
  return turns;
}
AI.thinkQuestion = async function (t) {
  const stage = STAGES[t.stage] || STAGES[0];
  const rules = `You are a Socratic thinking partner. The writer is working through ONE problem in written steps, the way one writes out a long calculation instead of holding it in the head. Stages, in order: ${STAGES.join(' → ')}. Current stage: "${stage}". Ask exactly ONE question (≤ 35 words) that helps them take the next concrete step in this stage. No advice, no summary, no praise, no preamble; do not repeat a question already asked. If the stage is "Decision", ask what they will decide and why; if it is "Next step", ask for the smallest action and when.${instructionsBlock()}`;
  const turns = [{ role: 'user', content: rules }, ...threadTurns(t), { role: 'user', content: `(Continue. Current stage: "${stage}". Ask your one question now.)` }];
  const { text } = await SB.caps.sample(turns, { modelTier: 'default', cache: false, purpose: 'think' });
  return cut(text.trim(), 400);
};

function streaks() {
  const days = new Set(SB.entries.map((e) => e.date)); let cur = 0; let d = new Date();
  if (!days.has(dateKey(d))) d = addDays(d, -1);
  while (days.has(dateKey(d))) { cur++; d = addDays(d, -1); }
  return { current: cur, days: days.size };
}
function filteredEntries() {
  const f = SB.jf; const q = f.q.trim().toLowerCase();
  return SB.entries.filter((e) => (!f.type || e.type === f.type) && (!f.theme || (e.themes || []).some((t) => slug(t) === slug(f.theme))) && (!q || (e.text + ' ' + (e.title || '') + ' ' + (e.themes || []).join(' ') + ' ' + (e.people || []).join(' ')).toLowerCase().includes(q)));
}

function ribbonHTML() {

}

}

/* ═══════════════════════════ review: weeks, months, goals ═══════════════════════════ */
function weeksWithEntries() { const set = new Map(); for (const e of SB.entries) { const k = weekKey(fromKey(e.date)); set.set(k, (set.get(k) || 0) + 1); } const cur = weekKey(new Date()); if (!set.has(cur)) set.set(cur, 0); return [...set.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 16); }
function monthsWithEntries() { const set = new Map(); for (const e of SB.entries) { const k = e.date.slice(0, 7); set.set(k, (set.get(k) || 0) + 1); } const cur = monthKey(new Date()); if (!set.has(cur)) set.set(cur, 0); return [...set.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 12); }

  root.innerHTML = `<div class="view-head"><h2>Review</h2><div class="seg"><button data-action="revTab" data-t="week" aria-pressed="${String(tab === 'week')}">Weeks</button><button data-action="revTab" data-t="month" aria-pressed="${String(tab === 'month')}">Months</button><button data-action="revTab" data-t="goals" aria-pressed="${String(tab === 'goals')}">Goals</button></div></div>
  ${tab === 'goals' ? goalsHTML() : `<div class="weeks">${(tab === 'week' ? weeks : months).map(([k, n]) => `<button class="chip" data-action="revPick" data-k="${k}" aria-pressed="${String(k === key)}">${tab === 'week' ? k.replace('-W', ' · w') : MONTHS[Number(k.slice(5, 7)) - 1].slice(0, 3) + ' ' + k.slice(0, 4)} <span class="mono muted">${n}</span>${SB.digests.has((tab === 'week' ? 'w-' : 'm-') + k) ? ' ✦' : ''}</button>`).join('')}</div>
  <div class="panel"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="eyebrow">${range} · ${count} entries</span><span style="flex:1"></span>${AI.ready() ? `<button class="btn ${digest ? '' : 'primary'}" data-action="genDigest" ${count === 0 && tab === 'week' ? 'disabled title="No entries this week"' : ''}>${digest ? 'Write it again' : tab === 'week' ? '✦ Write this week’s review' : '✦ Write the month’s reflection'}</button>` : '<span class="muted small">Claude is off; reviews need it.</span>'}</div>

}

    <div class="prose sm" style="margin-top:10px;max-width:70ch">Where your data is: in this page’s private store on claude.ai, which survives reloads, new versions and sessions, and is erased only if the artifact itself is deleted. What protects it: deleting a card only moves it to the trash; imports never overwrite a newer card; the page keeps a copy on each device you use; and the JSON export is a complete, importable snapshot while the Markdown export opens in any notes app. The one thing the page cannot do by itself is write a file without asking you, so it reminds you in the top bar when the last export is a week old. Weekly is a good rhythm; keep the files somewhere that is itself backed up.</div>
  </div>
  ${SB.trash.length ? `<h3 style="margin-top:14px">Trash</h3><div class="cards">${SB.trash.slice(0, 50).map((e) => `<div class="card" style="padding:10px 14px"><div class="top"><span class="type" style="--c:${typeVar(e.type)}"><i></i>${TYPE_LABEL[e.type] || 'Note'}</span><span class="time">${fmtShort(e.date)} ${e.time}</span><span class="muted small">deleted ${e.deletedAt ? ago(e.deletedAt) + ' ago' : ''}</span><span style="flex:1"></span><button class="btn sm" data-action="restore" data-id="${e.id}">Restore</button><button class="btn ghost sm" data-action="purge" data-id="${e.id}">Delete forever</button></div><div class="text clamp" style="font-size:15px;max-height:4.6em">${esc(e.text)}</div></div>`).join('')}</div>` : ''}`;
}
function localSafetyHTML() {
  const i = (window.LocalBridge && window.LocalBridge.info) || {}; const real = SB.entries.filter((e) => !e.example).length;
  const ago2 = (iso) => (iso ? `${fmtShort(iso.slice(0, 10))} ${iso.slice(11, 16)}` : 'never');
  return `<div class="panel" style="padding:12px 14px">
    <dl class="kv" style="display:grid;grid-template-columns:190px 1fr;gap:6px 12px;font-size:13.5px;margin:0 0 10px"><dt class="muted">Vault folder</dt><dd class="mono" style="word-break:break-all">${esc(i.vault || '')}</dd><dt class="muted">Entries on disk</dt><dd class="mono">${i.counts ? i.counts.entries : real} <span class="muted">(${SB.trash.length} in the trash)</span></dd><dt class="muted">Last automatic backup</dt><dd>${ago2(i.lastBackupAt)} <span class="muted">${i.backupCount ? `· ${i.backupCount} kept in ${esc(i.backupsDir || '')}` : ''}</span></dd><dt class="muted">Extra backup folders</dt><dd>${i.backupTargets && i.backupTargets.length ? i.backupTargets.map(esc).join('<br>') : '<span class="muted">none, add one with <code>sb backup add-target PATH</code></span>'}</dd><dt class="muted">Git history</dt><dd>${i.git ? 'on: every backup is also a commit' : '<span class="muted">off, turn on with <code>sb git init</code></span>'}</dd><dt class="muted">Claude API</dt><dd>${i.aiAvailable ? `on · ${esc(i.models ? i.models.main : '')} for reviews, ${esc(i.models ? i.models.filing : '')} for filing` : '<b style="color:var(--bad)">off</b>'}</dd><dt class="muted">API spend this month</dt><dd class="mono">${i.usage ? '$' + Number(i.usage.costUsd || 0).toFixed(2) + ' · ' + (i.usage.calls || 0) + ' calls' : '–'}</dd></dl>
    <div class="row"><button class="btn primary" data-action="localBackup">Back up now</button><button class="btn" data-action="exportJson">Export JSON</button><button class="btn" data-action="exportMd">Export Markdown</button><button class="btn ghost" data-action="localOpenVault">Open the vault folder</button><button class="btn ghost" data-action="importJson">Import JSON…</button><button class="btn ghost" data-action="localReindex">Rebuild index</button></div>
    <div class="prose sm" style="margin-top:10px;max-width:72ch">Every entry is a Markdown file with its card in the header, inside the vault folder above. The service zips the whole vault once a day and keeps the last thirty, and copies each zip to any extra folders you name (an iCloud or Google Drive folder is a good one). Nothing is ever deleted by the app: "Delete forever" moves the file into the vault’s <code>trash</code> folder. Back the vault up like any folder you care about: Time Machine covers it automatically.</div>
  </div>
  <h3 style="margin-top:14px">Claude API</h3>
  <div class="panel" style="padding:12px 14px"><div class="form" style="gap:8px"><label>API key (stored in <code>~/.config/second-brain/config.json</code>, readable only by you; never inside the vault or its backups)<input type="password" id="apiKey" placeholder="${i.aiAvailable ? 'a key is set; paste a new one to replace it' : 'sk-ant-…'}" autocomplete="off"></label><div class="row"><button class="btn" data-action="localSaveKey">Save key</button>${i.aiAvailable ? '<button class="btn ghost" data-action="localTestKey">Test the key</button>' : ''}<span class="muted small">Keys come from console.anthropic.com. You can also sign in once with <code>ant auth login</code> and leave this empty.</span></div>
    ${(() => { const opts = [['claude-opus-5-5', 'Claude Opus 5.5 · $4 / $20 per million tokens'], ['claude-opus-5', 'Claude Opus 5 · $5 / $25'], ['claude-sonnet-5', 'Claude Sonnet 5 · $2 / $10'], ['claude-haiku-4-5', 'Claude Haiku 4.5 · $1 / $5']]; const sel = (id, cur) => `<select id="${id}" class="search" style="min-width:0">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`; return `<div class="row" style="margin-top:10px;gap:14px"><label style="display:grid;gap:4px;font-size:13px;color:var(--ink-2)">Model for reviews, heads-ups, patterns and thinking${sel('mainModel', (i.models || {}).main)}</label><label style="display:grid;gap:4px;font-size:13px;color:var(--ink-2)">Model for filing entries${sel('filingModel', (i.models || {}).filing)}</label><button class="btn" data-action="localSaveModels" style="align-self:end">Save models</button></div>`; })()}
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-action="refileAll">Re-file all entries</button><span class="muted small">Runs filing again on every card with the current instructions, one after another; your own edits are kept. Useful after the filing rules improve.</span></div></div></div>
  ${SB.trash.length ? `<h3 style="margin-top:14px">Trash</h3><div class="cards">${SB.trash.slice(0, 50).map((e) => `<div class="card" style="padding:10px 14px"><div class="top"><span class="type" style="--c:${typeVar(e.type)}"><i></i>${TYPE_LABEL[e.type] || 'Note'}</span><span class="time">${fmtShort(e.date)} ${e.time}</span><span class="muted small">deleted ${e.deletedAt ? ago(e.deletedAt) + ' ago' : ''}</span><span style="flex:1"></span><button class="btn sm" data-action="restore" data-id="${e.id}">Restore</button><button class="btn ghost sm" data-action="purge" data-id="${e.id}">Delete forever</button></div><div class="text clamp" style="font-size:15px;max-height:4.6em">${esc(e.text)}</div></div>`).join('')}</div>` : ''}`;
}
ACTIONS.localBackup = async (el) => { el.disabled = true; el.textContent = 'Backing up…'; try { const r = await window.LocalBridge.api('POST', '/backup'); await window.LocalBridge.refreshInfo(); toast(`Backup written: ${r.file}${r.copies && r.copies.length ? ' and copied to ' + r.copies.length + ' folder' + (r.copies.length > 1 ? 's' : '') : ''}.`, 'good', 6000); } catch (e) { toast('Backup failed: ' + (e.message || e.code), 'bad'); } finally { renderSettings(); } };
ACTIONS.localOpenVault = async () => { try { await window.LocalBridge.api('POST', '/open-vault'); } catch (e) { toast('Could not open the folder.', 'bad'); } };
ACTIONS.localReindex = async (el) => { el.disabled = true; try { const r = await window.LocalBridge.api('POST', '/reindex'); toast(`Index rebuilt: ${r.entries} entries.`, 'good'); } catch (e) { toast('Reindex failed.', 'bad'); } finally { el.disabled = false; } };
ACTIONS.localSaveKey = async (el) => { const k = $('#apiKey').value.trim(); if (!k) { toast('Paste a key first.'); return; } el.disabled = true; try { const r = await window.LocalBridge.api('POST', '/config', { api_key: k }); await window.LocalBridge.refreshInfo(); toast(r.aiAvailable ? 'Key saved and working. Reloading…' : 'Key saved but the test call failed: ' + (r.error || ''), r.aiAvailable ? 'good' : 'bad', 6000); if (r.aiAvailable) setTimeout(() => location.reload(), 1200); } catch (e) { toast('Could not save the key: ' + (e.message || e.code), 'bad'); } finally { el.disabled = false; } };
ACTIONS.refileAll = async (el) => { if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = `Really re-file all ${SB.entries.filter((e) => !e.example).length} entries?`; setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Re-file all entries'; }, 5000); return; } el.disabled = true; const ids = SB.entries.filter((e) => !e.example).map((e) => e.id); let n = 0; const t = toast(`Re-filing 0 of ${ids.length}…`, '', 600000); for (const id of ids) { await fileEntry(id); n++; t.textContent = `Re-filing ${n} of ${ids.length}…`; } t.remove(); toast(`Re-filed ${n} entries.`, 'good'); el.disabled = false; el.dataset.armed = ''; el.textContent = 'Re-file all entries'; };
ACTIONS.localSaveModels = async (el) => { el.disabled = true; try { await window.LocalBridge.api('POST', '/config', { main_model: $('#mainModel').value, filing_model: $('#filingModel').value }); await window.LocalBridge.refreshInfo(); toast('Models saved.', 'good'); } catch (e) { toast('Could not save: ' + (e.message || e.code), 'bad'); } finally { renderSettings(); } };
ACTIONS.localTestKey = async (el) => { el.disabled = true; try { const r = await window.LocalBridge.api('POST', '/ai/test'); toast(r.ok ? `Claude answered from ${r.model}.` : 'The key did not work: ' + (r.error || ''), r.ok ? 'good' : 'bad', 6000); } catch (e) { toast('Test failed: ' + (e.message || e.code), 'bad'); } finally { el.disabled = false; } };
ACTIONS.restore = async (el) => { await restoreEntry(el.dataset.id); toast('Restored.', 'good'); };
ACTIONS.purge = async (el) => { if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Really delete forever?'; el.classList.add('danger'); setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Delete forever'; el.classList.remove('danger'); }, 4000); return; } await purgeEntry(el.dataset.id); toast('Deleted forever.'); };
ACTIONS.verifyStore = async (el) => {
  if (!SB.caps.db) return; el.disabled = true; const out = $('#storeCheck'); out.textContent = 'counting…';
  try { let total = 0, deleted = 0, cursorTs = null, pages = 0; while (pages++ < 100) { let q = SB.caps.db.collection('entries').orderBy('ts', 'desc').limit(1000); if (cursorTs != null) q = q.where('ts', '<', cursorTs); const snap = await q.get(); if (!snap.size) break; for (const d of snap.docs) { const x = d.data(); total++; if (x && x.deleted) deleted++; cursorTs = x && x.ts; } if (snap.size < 1000) break; }
    const g = (await SB.caps.db.collection('goals').get()).size, t = (await SB.caps.db.collection('threads').get()).size, dg = (await SB.caps.db.collection('digests').get()).size, hu = (await SB.caps.db.collection('headsup').get()).size;
    out.innerHTML = `<b class="mono">${total - deleted}</b> entries and <b class="mono">${deleted}</b> in the trash are in the store, plus ${g} goals, ${t} threads, ${dg} reviews, ${hu} readings. Checked ${timeKey()}.`; out.classList.remove('muted'); }
  catch (e) { out.textContent = 'The check failed: ' + dbCopy(e); } finally { el.disabled = false; }
};
ACTIONS.saveSettings = async () => { await saveSettings({ ...SB.settings, instructions: $('#setInstr').value.trim(), filingTier: $('#setTier').value }); toast('Settings saved.', 'good'); };
function exportPayload() { return { app: 'second-brain', version: 2, exportedAt: new Date().toISOString(), entries: SB.entries.filter((e) => !e.example), trash: SB.trash, goals: SB.goals.filter((g) => !g.example), threads: SB.threads.filter((t) => !t.example), digests: [...SB.digests.values()], insights: [...SB.insights.values()], headsup: [...SB.headsup.values()], settings: SB.settings }; }
function toMarkdown() {
  const p = exportPayload(); const byDate = new Map(); for (const e of p.entries) { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); }
  let md = `# Second Brain export\n\nExported ${p.exportedAt.slice(0, 10)}. ${p.entries.length} entries, ${p.goals.length} goals, ${p.threads.length} threads.\n`;
  for (const [date, es] of [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0]))) { md += `\n## ${date} (${WD_LONG[fromKey(date).getDay()]})\n`; for (const e of es.sort((a, b) => a.ts - b.ts)) { md += `\n### ${e.time} · ${TYPE_LABEL[e.type] || 'Note'}${e.title ? ' · ' + e.title : ''}\n\n${e.text}\n\n`; const f = []; if (effMood(e) != null) f.push(`mood ${fmtMood(effMood(e))}${e.mood.user == null ? ' (est.)' : ''}`); if (effEnergy(e) != null) f.push(`energy ${effEnergy(e)}${e.energy.user == null ? ' (est.)' : ''}`); if ((e.themes || []).length) f.push(`themes: ${e.themes.join(', ')}`); if ((e.people || []).length) f.push(`people: ${e.people.join(', ')}`); if ((e.projects || []).length) f.push(`projects: ${e.projects.join(', ')}`); if ((e.goals || []).length) f.push(`goals: ${e.goals.map(goalLabel).join(', ')}`); if (f.length) md += `*${f.join(' · ')}*\n`; for (const t of e.tasks || []) md += `- [${t.done ? 'x' : ' '}] ${t.text}\n`; for (const q of e.questions || []) md += `- ? ${q.text}${q.resolved ? ' (resolved)' : ''}\n`; for (const l of (e.links || []).filter((x) => x.status === 'accepted')) { const to = entry(l.to); if (to) md += `- → ${to.title || cut(to.text, 50)} (${to.date}): ${l.reason}\n`; } } }
  if (p.goals.length) { md += `\n## Goals\n`; for (const g of p.goals) md += `- **${g.label}** (${g.status})${g.why ? ' — ' + g.why : ''}${g.checkins && g.checkins.length ? ` — ${g.checkins[g.checkins.length - 1].progress}%` : ''}\n`; }
  if (p.threads.length) { md += `\n## Thinking threads\n`; for (const t of p.threads) { md += `\n### ${t.title || t.problem}\n\n`; for (const s of t.steps) md += `- **${s.role === 'claude' ? 'Claude' : 'Me'}** (${STAGES[s.stage] || ''}): ${s.text}\n`; if (t.outcome) md += `\n**Decision:** ${t.outcome.decision}  \n**Next step:** ${t.outcome.nextStep}\n`; } }
  if (p.digests.length) { md += `\n## Reviews\n`; for (const d of p.digests.sort((a, b) => a.from.localeCompare(b.from))) md += `\n### ${d.key} (${d.from} to ${d.to})\n\n**${d.data.headline}**\n\n${d.data.narrative}\n${d.data.question ? `\n> ${d.data.question}\n` : ''}`; }
  return md;
}
async function doSave(filename, data) { try { const r = await SB.caps.downloads.save({ filename, data }); if (r && r.status === 'saved' && SB.caps.db && !SB.readonly) await saveSettings({ ...SB.settings, lastExportAt: new Date().toISOString() }); toast('Saved.', 'good'); } catch (e) { if (e && e.code === 'declined') return; toast(({ too_large: 'The file is too large for this destination.', rate_limited: 'A save is already open; wait a moment.' })[e && e.code] || 'Could not save the file.', 'bad'); } }
ACTIONS.exportJson = async () => { if (SB.hasOlder) { toast('Loading older entries so the export is complete…'); await loadAllEntries(); } doSave(`second-brain-${dateKey()}.json`, JSON.stringify(exportPayload(), null, 2)); };
ACTIONS.exportMd = async () => { if (SB.hasOlder) { toast('Loading older entries so the export is complete…'); await loadAllEntries(); } doSave(`second-brain-${dateKey()}.md`, toMarkdown()); };
ACTIONS.importJson = () => $('#fileJson').click();
$('#fileJson').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f || !SB.caps.db) return;
  try { const p = JSON.parse(await f.text()); if (!p || !Array.isArray(p.entries)) throw new Error('shape'); const n = p.entries.length + (p.goals || []).length + (p.threads || []).length + (p.digests || []).length; const t = toast(`Importing ${n} items…`, '', 600000);
    if (SB.examples) { SB.examples = false; SB.entries = []; SB.byId = new Map(); SB.goals = []; SB.threads = []; }
    const newer = (incoming, existing) => !existing || !existing.updatedAt || !incoming.updatedAt || incoming.updatedAt > existing.updatedAt; let written = 0, skipped = 0;
    const put = async (coll, id, doc, existing) => { if (newer(doc, existing)) { await writeDoc(coll, id, doc); written++; } else skipped++; };
    for (const g of p.goals || []) if (g && g.id) await put('goals', g.id, g, SB.goals.find((x) => x.id === g.id));
    for (const e of [...(p.entries || []), ...(p.trash || [])]) if (e && e.id) await put('entries', e.id, e, entry(e.id) || SB.trash.find((x) => x.id === e.id));
    for (const th of p.threads || []) if (th && th.id) await put('threads', th.id, th, SB.threads.find((x) => x.id === th.id));
    for (const d of p.digests || []) if (d && d.key) await put('digests', d.key, d, SB.digests.get(d.key)); for (const i of p.insights || []) if (i && i.key) await put('insights', i.key, i, SB.insights.get(i.key)); for (const h of p.headsup || []) if (h && h.key) await put('headsup', h.key, h, SB.headsup.get(h.key));
    t.remove(); toast(`Import finished: ${written} written, ${skipped} skipped because the copy here was newer. Nothing was deleted.`, 'good', 7000); }
  catch (e) { toast('That file is not a Second Brain export.', 'bad'); }
});
